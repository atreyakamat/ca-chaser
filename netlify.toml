# Netlify detects Next.js and applies its runtime automatically.
# Environment variables are listed in .env.example and set in Netlify > Site configuration.
# Security headers are set in next.config.ts so they apply on any host.

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Only production deploys apply database migrations. Deploy previews never change the schema.
[context.production]
  command = "pnpm db:deploy && pnpm build"
