# Local / demo stack: `docker compose up --build`, then open http://localhost:3000
# Demo login (seeded): demo@docchase.test / demo-password-123
# These secrets are for a throwaway local demo only. Never reuse them anywhere real.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docchase
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docchase"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/docchase
      SESSION_SECRET: demo-only-session-secret-change-me-0123456789
      CRON_SECRET: demo-only-cron-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      MESSAGING_MODE: mock
      DEMO_SEED: "1"
    volumes:
      - uploads:/app/.data

volumes:
  pgdata:
  uploads:
